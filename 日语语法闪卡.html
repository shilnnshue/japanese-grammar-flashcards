  if(!synth || !text) return;
  try{
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP'; u.rate = 0.95; u.pitch = 1.0;
    if(selectedVoice){ const v = synth.getVoices().find(x=>x.name===selectedVoice); if(v) u.voice = v; }
    synth.speak(u);
  }catch(e){}
}
function playCloud(text){
  if(!audioEl){ try{ audioEl = new Audio(); }catch(e){ audioEl = null; } }
  if(!audioEl){ speakLocal(text); return; }
  try{
    const url = 'https://translate.google.com/translate_tts?ie=UTF-8&tl=ja&client=tw-ob&q=' + encodeURIComponent(text);
    audioEl.src = url;
    const p = audioEl.play();
    if(p && p.catch) p.catch(()=>speakLocal(text));
  }catch(e){ speakLocal(text); }
}
function speak(text, kind){
  if(!text) return;
  if(kind==='word'){ playLocalWord(curId, ()=>{ if(cloudMode){ playCloud(text); return; } speakLocal(text); }); return; }
  // 1) 优先播放本地自然语音（audio/001.mp3 … 368.mp3，离线真人级）
  playLocalFile(curId, ()=>{
    // 2) 本地文件缺失/失败时兜底：云端 → 系统语音
    if(cloudMode){ playCloud(text); return; }
    speakLocal(text);
  });
}
function playLocalWord(id, fallback){
  if(!id || typeof Audio==='undefined'){ fallback(); return; }
  try{
    if(!audioEl){ audioEl = new Audio(); }
    if(!audioEl){ fallback(); return; }
    let done = false;
    audioEl.onerror = ()=>{ if(!done){ done = true; fallback(); } };
    audioEl.src = 'audio/w/' + String(id).padStart(3,'0') + '.mp3';
    const p = audioEl.play();
    if(p && p.catch) p.catch(()=>{ if(!done){ done = true; fallback(); } });
  }catch(e){ fallback(); }
}
function playLocalFile(id, fallback){
  if(!id || typeof Audio==='undefined'){ fallback(); return; }
  try{
    if(!audioEl){ audioEl = new Audio(); }
    if(!audioEl){ fallback(); return; }
    let done = false;
    audioEl.onerror = ()=>{ if(!done){ done = true; fallback(); } };
    audioEl.src = 'audio/' + String(id).padStart(3,'0') + '.mp3';
    const p = audioEl.play();
    if(p && p.catch) p.catch(()=>{ if(!done){ done = true; fallback(); } });
  }catch(e){ fallback(); }
}

function loadMarks(){ try{ return JSON.parse(localStorage.getItem(LS_KEY))||{}; }catch(e){ return {}; } }
function saveMarks(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(marks)); }catch(e){} }

const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lv = d => (d.level||'').trim();
const cat = d => (d.category||'').trim() || '未分类';
const unit = d => (d.unit||'').trim() || '未分类';
const meaning = d => (d.meaning||'').trim() || '（暂无释义）';

// 句型清洗：去掉（注释）、取第一个变体、去〜/＋名词等 → 得到"单词"本体
function cleanPattern(p){
  return String(p==null?'':p)
    .replace(/[（(〔【].*?[）)〕】]/g,'')
    .split(/[\/、／]/)[0]
    .replace(/^[〜～~]/, '')
    .replace(/＋.*$/, '')
    .replace(/[…⋯]/g,'')
    .trim();
}
// 单元显示名：如 "1目的•原因•理由" → "第1单元 · 目的•原因•理由"
function unitLabel(u){
  const n=parseInt(u,10);
  if(isNaN(n)) return '第'+u+'单元';
  const rest=String(u).replace(/^\d+/,'').replace(/^[·•]/, '');
  return '第'+n+'单元' + (rest ? ' · '+rest : '');
}
// 例句中高亮语法词（返回安全 HTML；片假名归一化后最长优先匹配）
function kataToHira(s){ return s.replace(/[\u30a1-\u30f6]/g, ch => String.fromCharCode(ch.charCodeAt(0)-0x60)); }
function hlPattern(sentence, pattern){
  sentence = String(sentence==null?'':sentence);
  pattern = String(pattern==null?'':pattern);
  if(!sentence || !pattern) return esc(sentence);
  let norm='', map=[];
  for(let i=0;i<sentence.length;i++){
    const c=sentence[i];
    if(c>='ァ' && c<='ヶ'){ norm += kataToHira(c); map.push(i); }
    else { norm += c; map.push(i); }
  }
  const clean = cleanPattern(pattern);
  const cands = clean.split(/[\/、／]/).filter(Boolean).map(v=>v.trim()).filter(Boolean);
  const BAD = new Set(['は','に','を','が','で','と','も','の','へ','か','ね','よ','な','や','だ','です','ます','ない','こと']);
  const extra=[];
  cands.forEach(c=>{ c.split(/[…⋯〜～]/).forEach(p=>{ p=p.trim(); if(p.length>=2 && !BAD.has(p) && !cands.includes(p)) extra.push(p); }); });
  extra.forEach(p=>cands.push(p));
  const uniq=[...new Set(cands)].sort((a,b)=>b.length-a.length);
  let hit=null;
  for(const c of uniq){
    const nc=kataToHira(c);
    const idx=norm.indexOf(nc);
    if(idx>=0){ hit={nc, len:nc.length}; break; }
  }
  if(!hit) return esc(sentence);
  const ranges=[];
  let from=0;
  while(from < norm.length){
    const i=norm.indexOf(hit.nc, from);
    if(i<0) break;
    ranges.push([map[i], map[i+hit.len-1]+1]);
    from = i + hit.len;
  }
  let html='', pos=0;
  ranges.forEach(([a,b])=>{
    html += esc(sentence.slice(pos,a)) + '<mark>' + esc(sentence.slice(a,b)) + '</mark>';
    pos = b;
  });
  html += esc(sentence.slice(pos));
  return html;
}
const curSpeakText = () => flipped ? curWord : curPattern;

// build filter dropdowns
(function initFilters(){
  const cats=[...new Set(DATA.map(cat))].sort();
  const uns=[...new Set(DATA.map(unit))].sort((a,b)=>{
    const na=parseInt(a), nb=parseInt(b); return (isNaN(na)||isNaN(nb))? a.localeCompare(b):na-nb;
  });
  cats.forEach(c=>{ const o=document.createElement('option'); o.value=c; o.textContent=c; $('category').appendChild(o); });
  uns.forEach(u=>{ const o=document.createElement('option'); o.value=u; o.textContent=unitLabel(u); $('unit').appendChild(o); });
})();

function buildFiltered(){
  const q = state.search.trim().toLowerCase();
  let list = DATA.filter(d=>{
    if(state.level!=='all' && lv(d)!==state.level) return false;
    if(state.category!=='all' && cat(d)!==state.category) return false;
    if(state.unit!=='all' && unit(d)!==state.unit) return false;
    if(state.mode==='unmastered' && marks[d.id]==='known') return false;
    if(state.mode==='mastered' && marks[d.id]!=='known') return false;
    if(q && !((d.pattern||'').toLowerCase().includes(q) || meaning(d).toLowerCase().includes(q) || String(d.id)===q)) return false;
    return true;
  });
  if(state.mode==='shuffle'){ list = list.slice().sort(()=>Math.random()-0.5); }
  else { list.sort((a,b)=>a.id-b.id); }
  state.filtered = list;
  if(state.idx >= list.length) state.idx = Math.max(0, list.length-1);
  if(state.idx < 0) state.idx = 0;
}

function badges(d, front){
  const b=[];
  b.push(`<span class="badge id">#${d.id}</span>`);
  const l=lv(d); if(l==='1级') b.push(`<span class="badge lv1">1级</span>`); else if(l==='2级') b.push(`<span class="badge lv2">2级</span>`);
  b.push(`<span class="badge">${esc(unitLabel(unit(d)))}</span>`);
  b.push(`<span class="badge">${esc(cat(d))}</span>`);
  return b.join('');
}

function render(){
  const list = state.filtered;
  if(list.length===0){
    $('card').style.display='none';
    const scene=document.querySelector('.scene');
    scene.innerHTML='<div class="empty">没有符合条件的卡片，试试调整筛选或重置进度。</div>';
    $('pos').textContent='0 / 0'; updateStats(); return;
  }
  $('card').style.display='';
  const d = list[state.idx];
  $('fBadges').innerHTML = badges(d);
  $('fExJp').innerHTML = hlPattern(d.ex_jp || '', d.pattern);
  $('fExCn').innerHTML = esc(d.ex_cn || '');
  $('fPatternHint').innerHTML = '句型：' + esc(d.pattern) + ' ｜ 接続：' + esc(d.conn||'（不限）');
  $('bBadges').innerHTML = badges(d);
  $('bWord').innerHTML = esc(cleanPattern(d.pattern));
  $('bMeaning').innerHTML = esc(meaning(d));
  $('bConn').innerHTML = '接続：' + esc(d.conn||'（不限）');
  $('bPatternFoot').innerHTML = '句型：' + esc(d.pattern);
  $('pos').textContent = (state.idx+1) + ' / ' + list.length;
  $('card').classList.remove('flipped');
  flipped = false;
  curId = d.id || 0;
  curPattern = (d.ex_jp && d.ex_jp.trim()) ? d.ex_jp : (d.pattern || '');
  curWord = cleanPattern(d.pattern);
  if(autoSpeak) speak(curPattern, 'sentence');
  updateStats();
}

function updateStats(){
  const list = state.filtered || [];
  let ok=0, bad=0;
  list.forEach(d=>{ if(marks[d.id]==='known') ok++; else if(marks[d.id]==='unknown') bad++; });
  const total=list.length;
  $('sOk').textContent=ok; $('sBad').textContent=bad; $('sNew').textContent=Math.max(0,total-ok-bad);
  const pct=total? Math.round(ok/total*100):0; $('sPct').textContent=pct+'%'; $('bar').style.width=pct+'%';
}

function flip(){ flipped = !flipped; $('card').classList.toggle('flipped'); }
function next(){ if(state.filtered.length===0) return; state.idx=(state.idx+1)%state.filtered.length; render(); }
function prev(){ if(state.filtered.length===0) return; state.idx=(state.idx-1+state.filtered.length)%state.filtered.length; render(); }

function mark(val){
  const d = state.filtered[state.idx];
  if(!d) return;
  marks[d.id]=val; saveMarks();
  if(state.mode==='unmastered' && val==='known'){
    state.filtered.splice(state.idx,1);
    if(state.idx>=state.filtered.length) state.idx=Math.max(0,state.filtered.length-1);
  } else {
    next();
  }
  render();
}

// events
$('card').addEventListener('click', flip);
$('flipBtn').addEventListener('click', e=>{ e.stopPropagation(); flip(); });
$('nextBtn').addEventListener('click', next);
$('prevBtn').addEventListener('click', prev);
$('btnOk').addEventListener('click', e=>{ e.stopPropagation(); mark('known'); });
$('btnBad').addEventListener('click', e=>{ e.stopPropagation(); mark('unknown'); });
$('search').addEventListener('input', e=>{ state.search=e.target.value; state.idx=0; buildFiltered(); render(); });
$('level').addEventListener('change', e=>{ state.level=e.target.value; state.idx=0; buildFiltered(); render(); });
$('category').addEventListener('change', e=>{ state.category=e.target.value; state.idx=0; buildFiltered(); render(); });
$('unit').addEventListener('change', e=>{ state.unit=e.target.value; state.idx=0; buildFiltered(); render(); });
$('mode').addEventListener('change', e=>{ state.mode=e.target.value; state.idx=0; buildFiltered(); render(); });
$('shuffleBtn').addEventListener('click', ()=>{ state.filtered = state.filtered.slice().sort(()=>Math.random()-0.5); state.idx=0; render(); });
$('speakBtn').addEventListener('click', e=>{ e.stopPropagation(); speak(curSpeakText(), flipped?'word':'sentence'); });
$('autoSpeak').addEventListener('change', e=>{ autoSpeak = e.target.checked; if(autoSpeak) speak(curSpeakText(), flipped?'word':'sentence'); });
$('voiceSel').addEventListener('change', e=>{ selectedVoice = e.target.value; if(selectedVoice) speakLocal(curSpeakText()); });
$('cloudTTS').addEventListener('change', e=>{ cloudMode = e.target.checked; if(cloudMode) speak(curSpeakText(), flipped?'word':'sentence'); else speakLocal(curSpeakText()); });
$('resetBtn').addEventListener('click', ()=>{ if(confirm('确定要清空所有“认识/不认识”的标记吗？')){ marks={}; saveMarks(); buildFiltered(); render(); } });

document.addEventListener('keydown', e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return;
  if(e.key===' '){ e.preventDefault(); flip(); }
  else if(e.key==='ArrowRight'){ e.preventDefault(); next(); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); prev(); }
  else if(e.key==='k'||e.key==='K'){ mark('known'); }
  else if(e.key==='j'||e.key==='J'){ mark('unknown'); }
  else if(e.key==='s'||e.key==='S'){ speak(curSpeakText(), flipped?'word':'sentence'); }
});

try{
  buildFiltered();
  render();
}catch(err){
  const sc = document.querySelector('.scene');
  if(sc) sc.innerHTML = '<div class="empty">出错了：' + (err && err.message ? err.message : err) + '</div>';
  if(window.console) console.error(err);
}
</script>
</body>
